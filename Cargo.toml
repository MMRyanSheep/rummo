[package]
name = "rummo"
version = "0.1.0"
edition = "2024"
authors = ["RyanSheep"]
description = "A Pumpkin plugin."
license = "MIT"

[workspace]
members = ["tools/run-server"]
default-members = ["tools/run-server"]

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "0.2.1"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"

# Pumpkin's Wasm runtime cannot compile the unoptimized event bindings.
[profile.dev.package.rummo]
opt-level = 2

[profile.dev.package.pumpkin-plugin-api]
opt-level = 2

[profile.release]
lto = true
